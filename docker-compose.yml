services:
  wow-auction:
    build: .
    container_name: wow-auction-site
    ports:
      - "8899:80"
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/site/index.html', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
